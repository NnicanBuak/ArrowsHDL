version = 2
top = "packet_router"
sources = ["packet_router.v", "frame_check.v", "output_lane.v"]

[language]
standard = "1364-2005"

[[modules]]
name = "ingress0"
hdl = "frame_check"

[[modules]]
name = "ingress1"
hdl = "frame_check"

[[modules]]
name = "lane0"
hdl = "output_lane"
parameters = { DESTINATION = 0 }

[[modules]]
name = "lane1"
hdl = "output_lane"
parameters = { DESTINATION = 1 }

[[modules]]
name = "status"
hdl = "router_status"

[[inputs]]
name = "frame0"
width = 6
widget = "button"

[[inputs]]
name = "frame1"
width = 6
widget = "button"

[[inputs]]
name = "valid"
width = 2
widget = "button"

[[inputs]]
name = "ready"
width = 2
widget = "button"

[[connections]]
from = "frame0"
to = "ingress0.frame"

[[connections]]
from = "valid[0]"
to = "ingress0.valid"

[[connections]]
from = "frame0"
to = "lane0.frame0"

[[connections]]
from = "frame0"
to = "lane1.frame0"

[[connections]]
from = "ingress0.good"
to = "lane0.good0"

[[connections]]
from = "ingress0.good"
to = "lane1.good0"

[[connections]]
from = "ready[0]"
to = "lane0.ready"

[[connections]]
from = "lane0.grant0"
to = "status.lane0_grant0"

[[connections]]
from = "lane0.grant1"
to = "status.lane0_grant1"

[[connections]]
from = "frame1"
to = "ingress1.frame"

[[connections]]
from = "valid[1]"
to = "ingress1.valid"

[[connections]]
from = "frame1"
to = "lane0.frame1"

[[connections]]
from = "frame1"
to = "lane1.frame1"

[[connections]]
from = "ingress1.good"
to = "lane0.good1"

[[connections]]
from = "ingress1.good"
to = "lane1.good1"

[[connections]]
from = "ready[1]"
to = "lane1.ready"

[[connections]]
from = "lane1.grant0"
to = "status.lane1_grant0"

[[connections]]
from = "lane1.grant1"
to = "status.lane1_grant1"

[[connections]]
from = "lane0.valid"
to = "status.lane0_valid"

[[connections]]
from = "lane1.valid"
to = "status.lane1_valid"

[[connections]]
from = "ingress0.error"
to = "status.error0"

[[connections]]
from = "ingress1.error"
to = "status.error1"

[[outputs]]
name = "data0"
from = "lane0.data"
widget = "binary"

[[outputs]]
name = "data1"
from = "lane1.data"
widget = "binary"

[[outputs]]
name = "output_valid"
from = "status.output_valid"
widget = "binary"

[[outputs]]
name = "accepted"
from = "status.accepted"
widget = "binary"

[[outputs]]
name = "error"
from = "status.error"
widget = "binary"
