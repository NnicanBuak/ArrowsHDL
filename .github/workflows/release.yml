name: Release wheels

on:
  push:
    branches: [v0.1.0]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      ARROWSHDL_TEST_OUTPUT: ${{ github.workspace }}/build/test-results
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0
      - name: Set up static Linux target
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          echo 'CARGO_BUILD_TARGET=x86_64-unknown-linux-musl' >> "$GITHUB_ENV"
      - name: Build bundled graph compiler
        working-directory: tools
        run: |
          npm ci
          npm run build
      - name: Link the Windows C runtime statically
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build platform wheel
        run: |
          python -m pip install build wheel
          python -m build --wheel
      - name: Tag static Linux wheel
        if: runner.os == 'Linux'
        run: python -m wheel tags --platform-tag manylinux_2_17_x86_64 --remove dist/*.whl
      - name: Audit wheel resources and version
        run: python tools/release.py verify dist
      - name: Install wheel on the minimum supported Python
        run: |
          python -m pip install dist/*.whl
      - name: Test clean installation outside checkout
        run: |
          mkdir -p build "$RUNNER_TEMP/arrowshdl-smoke"
          cd "$RUNNER_TEMP/arrowshdl-smoke"
          python "$GITHUB_WORKSPACE/tools/check_installation.py" "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install wheel and current test dependencies
        run: python -m pip install dist/*.whl 'numpy==2.5.4'
      - name: Run complete regression suite against installed wheel
        run: python -m arrowshdl test --suite tests -o build/regression.json
      - name: Upload verified wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checks-${{ matrix.platform }}
          path: |
            build/regression.json
            build/clean-smoke.report.json
          if-no-files-found: ignore

  assemble:
    name: Assemble verified release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - name: Audit all platforms and generate SHA-256 checksums
        run: python tools/release.py manifest dist
      - name: Upload complete release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-v0.1.0
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: assemble
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-v0.1.0
          path: dist
      - name: Audit release and generate SHA-256 checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py manifest dist
      - name: Publish all verified wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "ArrowsHDL $GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              dist/*.whl dist/SHA256SUMS.txt
          fi
