[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "arrowshdl"
version = "0.1.0"
description = "Verilog and SystemVerilog compiler for Logic Arrows"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Nnican"}]
dependencies = ["yowasp-yosys==0.69.0.0.post1233", "Pillow==12.3.0", "nodejs-wheel-binaries==24.19.0"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Software Development :: Compilers"]

[project.optional-dependencies]
test = ["numpy==2.4.1"]

[project.scripts]
arrowshdl = "arrowshdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arrowshdl*"]

[tool.setuptools.package-data]
arrowshdl = ["library/*.v", "runtime/*.mjs", "data/templates/*.html", "data/sprites/*.png", "data/native/*", "data/licenses/*"]

[project.urls]
Repository = "https://github.com/NnicanBuak/ArrowsHDL"
Issues = "https://github.com/NnicanBuak/ArrowsHDL/issues"
